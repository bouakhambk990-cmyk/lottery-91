/* ---------- Storage adapter ----------
   Uses window.storage when available (Claude artifact environment).
   Falls back to browser localStorage for a standalone deployment (e.g. hosted on your own server via GitHub). */
const hasArtifactStorage = typeof window !== "undefined" && !!window.storage;

const localAdapter = {
  get: async (key, shared) => {
    const k = (shared ? "shared:" : "personal:") + key;
    const v = localStorage.getItem(k);
    if (v === null) throw new Error("not found");
    return { key, value: v, shared };
  },
  set: async (key, value, shared) => {
    localStorage.setItem((shared ? "shared:" : "personal:") + key, value);
    return { key, value, shared };
  },
  delete: async (key, shared) => {
    localStorage.removeItem((shared ? "shared:" : "personal:") + key);
    return { key, deleted: true, shared };
  },
};

const storage = hasArtifactStorage ? window.storage : localAdapter;

/* ---------- Amortization calculation ---------- */
function addMonths(dateStr, n) {
  const d = new Date(dateStr);
  d.setMonth(d.getMonth() + n);
  return d.toISOString().slice(0, 10);
}

function generateSchedule({ amount, termMonths, interestType, annualRate, startDate }) {
  const rows = [];
  if (interestType === "flat") {
    const totalInterest = amount * (annualRate / 100) * (termMonths / 12);
    const interestPerPeriod = totalInterest / termMonths;
    const principalPerPeriod = amount / termMonths;
    let balance = amount;
    for (let i = 1; i <= termMonths; i++) {
      balance -= principalPerPeriod;
      rows.push({ no: i, dueDate: addMonths(startDate, i), installment: principalPerPeriod + interestPerPeriod, principal: principalPerPeriod, interest: interestPerPeriod, balance: Math.max(balance, 0) });
    }
  } else {
    const r = annualRate / 100 / 12;
    const n = termMonths;
    const emi = r === 0 ? amount / n : (amount * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
    let bal = amount;
    for (let i = 1; i <= n; i++) {
      const interest = bal * r;
      let principal = emi - interest;
      if (i === n) principal = bal;
      bal = Math.max(bal - principal, 0);
      rows.push({ no: i, dueDate: addMonths(startDate, i), installment: principal + interest, principal, interest, balance: bal });
    }
  }
  return rows;
}

function lateFeeFor(row, today) {
  const due = new Date(row.dueDate);
  if (today <= due) return 0;
  const daysLate = Math.floor((today - due) / (1000 * 60 * 60 * 24));
  const blocks = Math.ceil(daysLate / 30);
  return row.installment * LATE_FEE_RATE * blocks;
}

/* ---------- Reports: financial overview + NPL + export ---------- */
function nplBucket(daysLate) {
  if (daysLate <= 15) return "1-15";
  if (daysLate <= 30) return "16-30";
  if (daysLate <= 60) return "31-60";
  return "60+";
}

function buildLoanReportRows(applications) {
  const today = new Date();
  return applications.map((app) => {
    const isDisbursed = app.status === "disbursed";
    let outstanding = 0, daysLate = 0, bucket = "";
    if (isDisbursed) {
      const schedule = generateSchedule({ amount: app.amount, termMonths: app.termMonths, interestType: app.interestType, annualRate: app.annualRate, startDate: app.disbursedAt });
      const idx = app.paidCount || 0;
      outstanding = idx > 0 ? schedule[idx - 1].balance : app.amount;
      const nextRow = schedule[idx];
      if (nextRow) {
        const due = new Date(nextRow.dueDate);
        const diff = Math.floor((today - due) / (1000 * 60 * 60 * 24));
        if (diff > 0) { daysLate = diff; bucket = nplBucket(diff); }
      }
    }
    return {
      "ລະຫັດ": app.id,
      "ລູກຄ້າ": app.customerName,
      "ຈຳນວນເງິນກູ້": app.amount,
      "ໄລຍະເວລາ(ເດືອນ)": app.termMonths,
      "ປະເພດດອກເບ້ຍ": INTEREST_TYPES[app.interestType] || "",
      "ອັດຕາ%/ປີ": app.annualRate || "",
      "ສະຖານະ": STATUS_META[app.status]?.label || app.status,
      "ງວດທີ່ຈ່າຍແລ້ວ": app.paidCount || 0,
      "ຍອດຄົງເຫຼືອ": Math.round(outstanding),
      "ຄ້າງຊຳລະ(ວັນ)": daysLate,
      "ກຸ່ມໜີ້ NPL": bucket,
    };
  });
}

function computeFinancials(applications) {
  const today = new Date();
  let totalDisbursed = 0, totalCollected = 0, outstanding = 0;
  applications.forEach((app) => {
    if (app.status !== "disbursed") return;
    totalDisbursed += app.amount;
    totalCollected += (app.payments || []).reduce((s, p) => s + p.amount, 0);
    const schedule = generateSchedule({ amount: app.amount, termMonths: app.termMonths, interestType: app.interestType, annualRate: app.annualRate, startDate: app.disbursedAt });
    const idx = app.paidCount || 0;
    outstanding += idx > 0 ? schedule[idx - 1].balance : app.amount;
  });
  return { totalDisbursed, totalCollected, outstanding };
}

function computeNPLRows(applications) {
  return buildLoanReportRows(applications).filter((r) => r["ກຸ່ມໜີ້ NPL"]);
}

function downloadBlob(content, filename, type) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportCSV(rows, filename) {
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const escape = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [headers.map(escape).join(","), ...rows.map((r) => headers.map((h) => escape(r[h])).join(","))];
  downloadBlob("\uFEFF" + lines.join("\r\n"), filename, "text/csv;charset=utf-8;");
}

function exportExcel(rows, filename) {
  if (!rows.length) return;
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Report");
  XLSX.writeFile(wb, filename);
}

function printReport(rows, title) {
  if (!rows.length) return;
  const headers = Object.keys(rows[0]);
  const html = `<html><head><meta charset="utf-8"/><title>${title}</title><style>
    body{font-family:'Noto Sans Lao','Noto Sans',sans-serif;padding:24px;color:#12213B;}
    h1{font-size:16px;margin-bottom:12px;}
    table{width:100%;border-collapse:collapse;font-size:11px;}
    th,td{border:1px solid #D9D0BC;padding:6px 8px;text-align:left;}
    th{background:#EAE2D2;}
  </style></head><body>
    <h1>${title}</h1>
    <table><thead><tr>${headers.map((h) => `<th>${h}</th>`).join("")}</tr></thead>
    <tbody>${rows.map((r) => `<tr>${headers.map((h) => `<td>${r[h] ?? ""}</td>`).join("")}</tr>`).join("")}</tbody></table>
  </body></html>`;
  const w = window.open("", "_blank");
  if (!w) return;
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(() => w.print(), 300);
}

/* ---------- Amortization table ---------- */
function AmortizationTable({ app, editable, onOpenPayment }) {
  const today = new Date();
  const schedule = generateSchedule({ amount: app.amount, termMonths: app.termMonths, interestType: app.interestType, annualRate: app.annualRate, startDate: app.disbursedAt });
  const paidCount = app.paidCount || 0;
  const totalLateFee = schedule.reduce((sum, row, idx) => {
    if (idx < paidCount) return sum;
    return sum + lateFeeFor(row, today);
  }, 0);
  const nextIdx = paidCount < schedule.length ? paidCount : -1;
  const payments = app.payments || [];

  return (
    <div className="space-y-3">
      <div className="flex gap-3 flex-wrap text-xs font-mono-ui">
        <span className="rounded-lg px-2.5 py-1.5" style={{ background: C.sand, color: C.ink60 }}>ອັດຕາ: <b style={{ color: C.ink }}>{app.annualRate}%/ປີ</b></span>
        <span className="rounded-lg px-2.5 py-1.5" style={{ background: C.sand, color: C.ink60 }}>ຈ່າຍແລ້ວ: <b style={{ color: C.success }}>{paidCount}/{schedule.length} ງວດ</b></span>
        {totalLateFee > 0 && <span className="rounded-lg px-2.5 py-1.5" style={{ background: `${C.danger}1A`, color: C.danger }}>ຄ່າປັບໄໝລວມ: <b>{fmtKip(totalLateFee)}</b></span>}
      </div>
      <div className="overflow-x-auto rounded-lg border" style={{ borderColor: "#E4DCC9" }}>
        <table className="w-full text-xs font-mono-ui" style={{ minWidth: 560 }}>
          <thead>
            <tr style={{ background: C.sandDeep, color: C.ink }}>
              <th className="text-left px-3 py-2">ງວດ</th>
              <th className="text-left px-3 py-2">ວັນຄົບກຳນົດ</th>
              <th className="text-right px-3 py-2">ຄ່າງວດ</th>
              <th className="text-right px-3 py-2">ເງິນຕົ້ນ</th>
              <th className="text-right px-3 py-2">ດອກເບ້ຍ</th>
              <th className="text-right px-3 py-2">ຍອດຄົງເຫຼືອ</th>
              <th className="text-left px-3 py-2">ສະຖານະ</th>
              {editable && <th className="px-3 py-2"></th>}
            </tr>
          </thead>
          <tbody>
            {schedule.map((row, idx) => {
              const paid = idx < paidCount;
              const fee = paid ? 0 : lateFeeFor(row, today);
              const overdue = !paid && fee > 0;
              const isNext = idx === nextIdx;
              return (
                <tr key={row.no} style={{ borderTop: "1px solid #EFE9DB", background: isNext ? `${C.gold}0D` : "transparent" }}>
                  <td className="px-3 py-2" style={{ color: C.ink }}>{row.no}</td>
                  <td className="px-3 py-2" style={{ color: C.ink60 }}>{row.dueDate}</td>
                  <td className="px-3 py-2 text-right" style={{ color: C.ink }}>{fmtKip(row.installment)}</td>
                  <td className="px-3 py-2 text-right" style={{ color: C.ink60 }}>{fmtKip(row.principal)}</td>
                  <td className="px-3 py-2 text-right" style={{ color: C.ink60 }}>{fmtKip(row.interest)}</td>
                  <td className="px-3 py-2 text-right" style={{ color: C.ink60 }}>{fmtKip(row.balance)}</td>
                  <td className="px-3 py-2">
                    {paid ? (
                      <span className="inline-flex items-center gap-1" style={{ color: C.success }}><CheckCircle2 size={12} /> ຈ່າຍແລ້ວ</span>
                    ) : overdue ? (
                      <span className="inline-flex items-center gap-1" style={{ color: C.danger }}><AlertCircle size={12} /> ຄ້າງ +{fmtKip(fee)}</span>
                    ) : (
                      <span className="inline-flex items-center gap-1" style={{ color: C.ink40 }}><Circle size={12} /> {isNext ? "ງວດຕໍ່ໄປ" : "ລໍຖ້າ"}</span>
                    )}
                  </td>
                  {editable && <td className="px-3 py-2">{!paid && isNext && <button onClick={() => onOpenPayment(app)} className="text-[11px] font-semibold rounded-md px-2 py-1" style={{ background: C.ink, color: C.white }}>ບັນທຶກຊຳລະ</button>}</td>}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      {payments.length > 0 && (
        <div>
          <p className="text-xs font-bold mb-1.5" style={{ color: C.ink }}>ປະຫວັດການຊຳລະ</p>
          <div className="space-y-1.5">
            {payments.map((p) => (
              <div key={p.id} className="flex items-center justify-between text-xs font-mono-ui rounded-lg px-3 py-2" style={{ background: C.sand }}>
                <span className="flex items-center gap-1.5" style={{ color: C.ink }}>
                  {p.method === "cash" ? <CashIcon size={12} style={{ color: C.success }} /> : <Landmark size={12} style={{ color: C.river }} />}
                  ງວດ {p.installmentNo} · {fmtKip(p.amount)}
                </span>
                <span style={{ color: C.ink60 }}>{p.date}{p.hasReceipt && <ImageIcon size={11} className="inline ml-1.5" style={{ color: C.ink40 }} />}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------- Payment recording modal (with simulated OCR) ---------- */
function PaymentModal({ app, onClose, onRecord }) {
  const today = new Date();
  const schedule = generateSchedule({ amount: app.amount, termMonths: app.termMonths, interestType: app.interestType, annualRate: app.annualRate, startDate: app.disbursedAt });
  const nextIdx = app.paidCount || 0;
  const row = schedule[nextIdx];
  const fee = row ? lateFeeFor(row, today) : 0;
  const defaultAmount = row ? Math.round(row.installment + fee) : 0;

  const [method, setMethod] = useState("transfer");
  const [amount, setAmount] = useState(String(defaultAmount));
  const [date, setDate] = useState(today.toISOString().slice(0, 10));
  const [reference, setReference] = useState("");
  const [fileName, setFileName] = useState("");
  const [ocrLoading, setOcrLoading] = useState(false);
  const [ocrDone, setOcrDone] = useState(false);

  const handleFile = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setFileName(file.name);
    setOcrDone(false);
  };

  const runOcr = () => {
    setOcrLoading(true);
    setTimeout(() => {
      setAmount(String(defaultAmount));
      setDate(today.toISOString().slice(0, 10));
      setReference("BCEL-" + Math.floor(10000 + Math.random() * 89999));
      setOcrLoading(false);
      setOcrDone(true);
    }, 1200);
  };

  const submit = (e) => {
    e.preventDefault();
    if (!amount || Number(amount) <= 0) return;
    onRecord(app.id, { id: "p_" + Date.now(), installmentNo: (row?.no) || nextIdx + 1, amount: Number(amount), method, date, reference, hasReceipt: !!fileName });
    onClose();
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(18,33,59,0.5)" }}>
      <form onSubmit={submit} className="w-full max-w-sm rounded-2xl p-5 space-y-3" style={{ background: C.white }}>
        <div className="flex items-center justify-between">
          <p className="text-sm font-bold" style={{ color: C.ink }}>ບັນທຶກການຊຳລະ · ງວດ {row?.no}</p>
          <button type="button" onClick={onClose} style={{ color: C.ink40 }}><X size={18} /></button>
        </div>

        <div className="flex gap-2">
          {[{ k: "cash", label: "ເງິນສົດ", icon: CashIcon }, { k: "transfer", label: "ໂອນທະນາຄານ", icon: Landmark }].map((m) => (
            <button type="button" key={m.k} onClick={() => setMethod(m.k)} className="flex-1 flex items-center justify-center gap-1.5 rounded-lg py-2 text-xs font-semibold" style={{ background: method === m.k ? C.ink : C.sandDeep, color: method === m.k ? C.white : C.ink60 }}>
              <m.icon size={13} /> {m.label}
            </button>
          ))}
        </div>

        {method === "transfer" && (
          <div className="rounded-lg border p-3 space-y-2" style={{ borderColor: "#E4DCC9", background: C.sand }}>
            <label className="flex items-center gap-2 text-xs font-semibold cursor-pointer" style={{ color: C.ink }}>
              <Upload size={14} style={{ color: C.river }} /> {fileName || "ແນບຮູບສລິບການໂອນເງິນ"}
              <input type="file" accept="image/*" className="hidden" onChange={handleFile} />
            </label>
            {fileName && !ocrDone && (
              <button type="button" onClick={runOcr} disabled={ocrLoading} className="w-full flex items-center justify-center gap-1.5 text-xs font-semibold rounded-lg py-2" style={{ background: `${C.river}1A`, color: C.river }}>
                {ocrLoading ? <Loader2 size={13} className="animate-spin" /> : <Sparkles size={13} />}

/* ---------- Notifications ---------- */
function computeNotifications(applications) {
  const today = new Date();
  const notifs = [];
  applications.filter((a) => a.status === "disbursed").forEach((app) => {
    const schedule = generateSchedule({ amount: app.amount, termMonths: app.termMonths, interestType: app.interestType, annualRate: app.annualRate, startDate: app.disbursedAt });
    const idx = app.paidCount || 0;
    const row = schedule[idx];
    if (!row) return;
    const due = new Date(row.dueDate);
    const daysDiff = Math.round((due - today) / (1000 * 60 * 60 * 24));
    if (daysDiff < 0) notifs.push({ appId: app.id, customerName: app.customerName, dueDate: row.dueDate, installmentNo: row.no, amount: row.installment, kind: "overdue", daysLate: -daysDiff });
    else if (daysDiff <= 3) notifs.push({ appId: app.id, customerName: app.customerName, dueDate: row.dueDate, installmentNo: row.no, amount: row.installment, kind: "upcoming", daysLeft: daysDiff });
  });
  return notifs.sort((a, b) => (a.kind === "overdue" ? -1 : 1));
}

      </div>
      <NotificationsPanel applications={applications} />
      <div><p className="text-sm font-bold mb-3" style={{ color: C.ink }}>ຄິວຄຳຮ້ອງກູ້ເງິນ</p><ApplicationsQueue applications={applications} users={users} onUpdateApp={onUpdateApp} onOpenPayment={setPayingApp} /></div>
      <ComingSoon items={[]} />
      {payingApp && <PaymentModal app={payingApp} onClose={() => setPayingApp(null)} onRecord={onRecordPayment} />}
    </div>
  );
}

function CustomerPanel({ user, applications, onSaveKyc, onSubmitApp }) {
  const myApps = applications.filter((a) => a.customerId === user.id).sort((a, b) => (a.submittedAt < b.submittedAt ? 1 : -1));
  const myNotifs = computeNotifications(myApps);
  return (
    <div className="p-6 space-y-5 max-w-2xl mx-auto w-full">
      <div><h1 className="text-xl font-bold" style={{ color: C.ink }}>ສະບາຍດີ, {user.name}</h1><p className="text-sm" style={{ color: C.ink60 }}>ບັນຊີຂອງທ່ານພ້ອມນຳໃຊ້ແລ້ວ</p></div>
      {myNotifs.map((n) => (
        <div key={n.appId + n.installmentNo} className="flex items-center gap-2 rounded-xl px-4 py-3 text-sm" style={{ background: n.kind === "overdue" ? `${C.danger}14` : `${C.gold}14`, color: n.kind === "overdue" ? C.danger : C.ink }}>
          <Bell size={15} />
          {n.kind === "overdue" ? `ທ່ານຄ້າງຊຳລະງວດ ${n.installmentNo} ມາແລ້ວ ${n.daysLate} ວັນ (${fmtKip(n.amount)})` : `ງວດ ${n.installmentNo} ຄົບກຳນົດອີກ ${n.daysLeft} ວັນ (${fmtKip(n.amount)})`}
        </div>
      ))}
      <KycForm user={user} onSave={onSaveKyc} />
      <div>
        <p className="text-sm font-bold mb-3" style={{ color: C.ink }}>ຄຳຮ້ອງກູ້ຂອງຂ້ອຍ</p>
        <div className="space-y-3">
          <LoanApplicationForm onSubmit={onSubmitApp} hasKyc={!!user.kyc} />
          {myApps.map((app) => (
            <ApplicationCard key={app.id} app={app}>
              {app.status === "disbursed" ? <AmortizationTable app={app} editable={false} /> :
                app.status === "rejected" ? <p className="text-sm" style={{ color: C.danger }}>ຄຳຮ້ອງນີ້ຖືກປະຕິເສດ</p> :
                app.status === "approved" ? <p className="text-sm" style={{ color: C.river }}>ອະນຸມັດແລ້ວ ອັດຕາ {app.annualRate}%/ປີ — ລໍຖ້າຈ່າຍເງິນກູ້</p> :
                <p className="text-sm" style={{ color: C.ink60 }}>ລໍຖ້າພະນັກງານກວດສອບ</p>}
            </ApplicationCard>
          ))}
          {myApps.length === 0 && <p className="text-sm text-center py-2" style={{ color: C.ink40 }}>ທ່ານຍັງບໍ່ມີຄຳຮ້ອງກູ້ເງິນ</p>}
        </div>
      </div>
      <ComingSoon items={[]} />
    </div>
  );
}

/* ---------- App ---------- */
function App() {
  const [users, setUsers] = useState(null);
  const [applications, setApplications] = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [initializing, setInitializing] = useState(true);

  useEffect(() => {
    (async () => {
      const [uList, aList] = await Promise.all([loadUsers(), loadApplications()]);
      setUsers(uList); setApplications(aList);
      const session = await loadSession();
      if (session) { const u = uList.find((x) => x.id === session.userId); if (u) setCurrentUser(u); }
      setInitializing(false);
    })();
  }, []);

  const handleLogin = useCallback(async (contact, password) => {
    setBusy(true); setError("");
    await new Promise((r) => setTimeout(r, 350));
    if (contact === "__google_demo__") { const demo = users.find((u) => u.id === "u_customer"); setCurrentUser(demo); await saveSession(demo.id); setBusy(false); return; }
    const found = users.find((u) => u.contact.toLowerCase() === contact.toLowerCase() && u.password === password);
    if (!found) setError("ອີເມວ/ເບີໂທ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ");
    else if (found.status !== "active") setError("ບັນຊີນີ້ຖືກລະງັບ, ກະລຸນາຕິດຕໍ່ຜູ້ດູແລລະບົບ");
    else { setCurrentUser(found); await saveSession(found.id); }
    setBusy(false);
  }, [users]);

  const handleRegister = useCallback(async ({ name, contact, contactType, password }) => {
    if (users.some((u) => u.contact.toLowerCase() === contact.toLowerCase())) { setError("ອີເມວ/ເບີໂທນີ້ຖືກໃຊ້ແລ້ວ"); return; }
    setBusy(true);
    const newUser = { id: "u_" + Date.now(), name, contact, contactType, password, role: "customer", status: "active", createdAt: new Date().toISOString().slice(0, 10), kyc: null };
    const updated = [...users, newUser]; setUsers(updated); await saveUsers(updated);
    setCurrentUser(newUser); await saveSession(newUser.id); setBusy(false);
  }, [users]);

  const handleUpdateUser = useCallback(async (id, patch) => {
    const updated = users.map((u) => (u.id === id ? { ...u, ...patch } : u));
    setUsers(updated); await saveUsers(updated);
    if (currentUser?.id === id) setCurrentUser({ ...currentUser, ...patch });
  }, [users, currentUser]);

  const handleSaveKyc = useCallback((kyc) => { handleUpdateUser(currentUser.id, { kyc }); }, [currentUser, handleUpdateUser]);

  const handleSubmitApp = useCallback(async (data) => {
    const newApp = { id: "a_" + Date.now(), customerId: currentUser.id, customerName: currentUser.name, ...data, status: "pending", submittedAt: new Date().toISOString().slice(0, 10), annualRate: null, disbursedAt: null, paidCount: 0, reviewNote: "", payments: [] };
    const updated = [newApp, ...applications]; setApplications(updated); await saveApplications(updated);
  }, [applications, currentUser]);

  const handleUpdateApp = useCallback(async (id, patch) => {
    const updated = applications.map((a) => (a.id === id ? { ...a, ...patch } : a));
    setApplications(updated); await saveApplications(updated);
  }, [applications]);

  const handleRecordPayment = useCallback(async (appId, payment) => {
    const updated = applications.map((a) => (a.id === appId ? { ...a, paidCount: (a.paidCount || 0) + 1, payments: [...(a.payments || []), payment] } : a));
    setApplications(updated); await saveApplications(updated);
  }, [applications]);

  const handleLogout = useCallback(async () => { setCurrentUser(null); await clearSession(); }, []);

  if (initializing) {
    return <div className="min-h-screen flex items-center justify-center" style={{ background: C.sand }}><style>{FONT_IMPORT}</style><Loader2 className="animate-spin" style={{ color: C.ink }} /></div>;
  }

  return (
    <div style={{ minHeight: "100vh" }}>
      <style>{FONT_IMPORT}</style>
      {!currentUser ? (
        <AuthScreen users={users} onLogin={handleLogin} onRegister={handleRegister} error={error} setError={setError} busy={busy} />
      ) : (
        <div style={{ background: C.sand, minHeight: "100vh" }}>
          <TopBar user={currentUser} onLogout={handleLogout} />
          {currentUser.role === "admin" && <AdminPanel users={users} applications={applications} onUpdateUser={handleUpdateUser} />}
          {currentUser.role === "officer" && <OfficerPanel user={currentUser} users={users} applications={applications} onUpdateApp={handleUpdateApp} onRecordPayment={handleRecordPayment} />}
          {currentUser.role === "customer" && <CustomerPanel user={currentUser} applications={applications} onSaveKyc={handleSaveKyc} onSubmitApp={handleSubmitApp} />}
        </div>
      )}
    </div>
  );
}

const root = createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
